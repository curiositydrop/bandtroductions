<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="bt-analytics.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07110f">
<title>Radio Share Kit preview | BANDtroductions</title>
<style>
  body{margin:0;background:#070b0a;color:#eef6f4;font-family:Arial,Helvetica,sans-serif}
  .phone{width:min(430px,100%);margin:0 auto;padding:18px 16px 32px;box-sizing:border-box}
  .eyebrow{margin:0;color:#0ccfbd;font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
  h1{margin:6px 0;font-size:1.7rem;line-height:1.05}
  .lede{margin:0 0 14px;color:#9aada9;font-size:.9rem;line-height:1.4}
  .switch{display:flex;gap:8px;margin:0 0 14px}
  .switch a{flex:1;text-align:center;text-decoration:none;min-height:44px;display:grid;place-items:center;border-radius:999px;border:1px solid #315650;color:#0ccfbd;font-weight:900}
  .switch a[aria-current="page"]{background:#0ccfbd;color:#06110f}
  .sheet{border:1px solid #315650;border-radius:18px;background:#0e1413;padding:14px}
  select,input{width:100%;box-sizing:border-box;min-height:48px;margin:0 0 10px;border-radius:12px;border:1px solid #3a4443;background:#050707;color:#fff;padding:10px;font:inherit}
</style>
</head>
<body>
<main class="phone">
  <p class="eyebrow" id="where">Band profile</p>
  <h1 id="title">Harbor Lights</h1>
  <p class="lede" id="lede">Sample preview for the band owner. This page does not read or change the radio library.</p>
  <nav class="switch" aria-label="Preview surfaces">
    <a id="owner-link" href="radio-share-kit-preview.html?view=owner">Owner</a>
    <a id="admin-link" href="radio-share-kit-preview.html?view=admin">Radio Control Room</a>
  </nav>
  <section class="sheet" id="sheet">
    <div id="admin-picker" hidden>
      <input id="finder" type="search" placeholder="Find a band" aria-label="Find a band">
      <select id="band" aria-label="Band with approved radio songs"></select>
    </div>
    <div id="kit"></div>
  </section>
</main>
<script type="module">
import { mountShareKit } from './radio-share-kit.js';

const params = new URLSearchParams(location.search);
const view = params.get('view') === 'admin' ? 'admin' : 'owner';
const photo = params.get('photo') === 'missing' ? '' : (params.get('photo') || 'bt-hero-horns-user.jpg');
const samples = [
  { key: 'harbor', name: 'Harbor Lights', profileId: 'preview-harbor-lights', image: photo, songCount: 2, surface: view },
  { key: 'northline', name: 'Northline', profileId: 'preview-northline', image: '', songCount: 1, surface: view }
];

const ownerLink = document.getElementById('owner-link');
const adminLink = document.getElementById('admin-link');
ownerLink.setAttribute('aria-current', view === 'owner' ? 'page' : 'false');
adminLink.setAttribute('aria-current', view === 'admin' ? 'page' : 'false');
document.getElementById('where').textContent = view === 'admin' ? 'Radio Control Room' : 'Your band profile';
document.getElementById('title').textContent = view === 'admin' ? 'Share kit' : 'Harbor Lights';
document.getElementById('lede').textContent = view === 'admin'
  ? 'Sample of the admin tool for any band that already has an approved song. Nothing here is saved.'
  : 'Sample of what an eligible band owner sees. Nothing here is saved.';

const kit = document.getElementById('kit');
const picker = document.getElementById('admin-picker');
const select = document.getElementById('band');
const finder = document.getElementById('finder');

function shown() {
  const query = finder.value.trim().toLowerCase();
  return samples.filter(band => !query || band.name.toLowerCase().includes(query));
}

async function show(band) {
  kit.replaceChildren();
  const mount = document.createElement('div');
  kit.appendChild(mount);
  await mountShareKit(mount, band);
}

if (view === 'admin') {
  picker.hidden = false;
  const fill = () => {
    const list = shown();
    select.replaceChildren();
    list.forEach(band => {
      const option = document.createElement('option');
      option.value = band.key;
      option.textContent = `${band.name} · ${band.songCount} approved`;
      select.appendChild(option);
    });
    const band = list.find(item => item.key === select.value) || list[0];
    if (band) show(band);
  };
  select.addEventListener('change', () => {
    const band = samples.find(item => item.key === select.value);
    if (band) show(band);
  });
  finder.addEventListener('input', fill);
  fill();
} else {
  show(samples[0]);
}
</script>
</body>
</html>
