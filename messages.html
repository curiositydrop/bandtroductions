<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | BANDtroductions Social</title><style>:root{--bg:#090a0a;--panel:#111313;--line:#343838;--teal:#25c7c1;--text:#eee;--muted:#9ca3a3}*{box-sizing:border-box}body{margin:0;background:#090a0a;color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);padding:14px;background:#0d0f0f}.top h1{margin:0;font-size:28px}.top span{color:var(--teal)}.back{color:var(--teal);text-decoration:none;font-weight:800}.layout{display:grid;grid-template-columns:340px 1fr;gap:12px;margin-top:12px}.panel{border:1px solid var(--line);background:linear-gradient(160deg,#151717,#0b0c0c);min-height:500px}.panel h2{margin:0;padding:12px;color:var(--teal);font-size:16px;border-bottom:1px solid var(--line);text-transform:uppercase}.search-box{padding:10px;border-bottom:1px solid var(--line);background:#0b0d0d}.search-box label{display:block;color:var(--teal);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}.profile-search{width:100%;padding:10px;border:1px solid #3b4141;background:#080a0a;color:#fff;font-size:14px;outline:none}.profile-search:focus{border-color:var(--teal)}.search-results{display:none;max-height:250px;overflow:auto;border:1px solid #283030;border-top:0;background:#0a0c0c}.search-results.show{display:block}.search-result{width:100%;display:grid;grid-template-columns:38px minmax(0,1fr);gap:9px;align-items:center;padding:9px;border:0;border-bottom:1px solid #242929;background:transparent;color:#ddd;text-align:left;cursor:pointer}.search-result:last-child{border-bottom:0}.search-result:hover{background:#111919}.search-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;border:1px solid #466;background:#151919;display:grid;place-items:center;color:var(--teal);font-size:11px;font-weight:900}.search-avatar img{width:100%;height:100%;object-fit:cover;display:block}.search-name{color:var(--teal);font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.search-meta{display:block;color:#888;font-size:10px;margin-top:2px}.search-empty{padding:10px;color:#888;font-size:11px}.privacy-note{padding:8px 10px;border-bottom:1px solid var(--line);color:#888;font-size:10px;line-height:1.35}.privacy-note strong{color:#bbb}.status{padding:14px;color:var(--muted)}.conversation{display:block;padding:12px;border-bottom:1px solid #252929;color:#ddd;text-decoration:none}.conversation:hover,.conversation.active{background:#121919}.conversation b{color:var(--teal)}.conversation small{display:block;color:#888;margin-top:4px}.thread{display:flex;flex-direction:column;height:560px}.thread-head{padding:12px;border-bottom:1px solid var(--line);font-weight:900;color:var(--teal)}.messages{flex:1;overflow:auto;padding:12px}.bubble{max-width:80%;padding:9px 11px;margin:7px 0;border:1px solid #333;background:#151818;line-height:1.35}.bubble.mine{margin-left:auto;border-color:#277e79;background:#0e1d1c}.bubble small{display:block;color:#777;margin-top:4px}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;min-height:48px;background:#090b0b;color:#fff;border:1px solid #3b4141;padding:10px}.composer button{background:var(--teal);border:0;padding:0 18px;font-weight:900}.empty{padding:24px;color:#888;text-align:center}@media(max-width:700px){.wrap{padding:6px}.layout{grid-template-columns:38% 62%;gap:4px}.top{padding:10px}.top h1{font-size:20px}.back{font-size:12px}.search-box{padding:6px}.search-box label{font-size:7px}.profile-search{padding:7px;font-size:10px}.search-result{grid-template-columns:26px minmax(0,1fr);gap:5px;padding:6px}.search-avatar{width:26px;height:26px;font-size:7px}.search-name{font-size:9px}.search-meta,.search-empty,.privacy-note{font-size:7px}.conversation{padding:8px;font-size:10px}.conversation small{font-size:8px}.thread{height:68vh}.bubble{font-size:11px}.composer{padding:5px;gap:4px}.composer textarea{font-size:11px;min-height:42px}.composer button{padding:0 9px;font-size:10px}}</style></head><body><div class="wrap"><header class="top"><h1>BANDtroductions <span>Messages</span></h1><a class="back" href="index.html">← Dashboard</a></header><main class="layout"><section class="panel"><h2>Inbox</h2><div class="search-box"><label for="profile-search">Start a private message</label><input id="profile-search" class="profile-search" type="search" autocomplete="off" placeholder="Search bands, musicians, venues, fans…"><div id="search-results" class="search-results"></div></div><div class="privacy-note"><strong>Private messages.</strong> Conversations here are not posted to Community or shown publicly on profiles.</div><div id="conversation-list" class="status">Sign in to view messages.</div></section><section class="panel"><div class="thread"><div id="thread-head" class="thread-head">Select a conversation</div><div id="messages" class="messages"><div class="empty">Search a profile or select an existing conversation.</div></div><form id="composer" class="composer" hidden><textarea id="message-input" maxlength="2000" placeholder="Write a private message…"></textarea><button type="submit">SEND</button></form></div></section></main></div><script type="module" src="messages.js?v=3"></script></body></html>
