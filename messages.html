<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | BANDtroductions Social</title><style>:root{--bg:#090a0a;--panel:#111313;--line:#343838;--teal:#25c7c1;--text:#eee;--muted:#9ca3a3}*{box-sizing:border-box}body{margin:0;background:#090a0a;color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);padding:14px;background:#0d0f0f}.top h1{margin:0;font-size:28px}.top span{color:var(--teal)}.back{color:var(--teal);text-decoration:none;font-weight:800}.layout{display:grid;grid-template-columns:320px 1fr;gap:12px;margin-top:12px}.panel{border:1px solid var(--line);background:linear-gradient(160deg,#151717,#0b0c0c);min-height:500px}.panel h2{margin:0;padding:12px;color:var(--teal);font-size:16px;border-bottom:1px solid var(--line);text-transform:uppercase}.status{padding:14px;color:var(--muted)}.conversation{display:block;padding:12px;border-bottom:1px solid #252929;color:#ddd;text-decoration:none}.conversation:hover,.conversation.active{background:#121919}.conversation b{color:var(--teal)}.conversation small{display:block;color:#888;margin-top:4px}.thread{display:flex;flex-direction:column;height:500px}.thread-head{padding:12px;border-bottom:1px solid var(--line);font-weight:900;color:var(--teal)}.messages{flex:1;overflow:auto;padding:12px}.bubble{max-width:80%;padding:9px 11px;margin:7px 0;border:1px solid #333;background:#151818;line-height:1.35}.bubble.mine{margin-left:auto;border-color:#277e79;background:#0e1d1c}.bubble small{display:block;color:#777;margin-top:4px}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;min-height:48px;background:#090b0b;color:#fff;border:1px solid #3b4141;padding:10px}.composer button{background:var(--teal);border:0;padding:0 18px;font-weight:900}.empty{padding:24px;color:#888;text-align:center}@media(max-width:700px){.wrap{padding:6px}.layout{grid-template-columns:36% 64%;gap:4px}.top h1{font-size:20px}.conversation{padding:8px;font-size:11px}.conversation small{font-size:9px}.thread{height:68vh}.bubble{font-size:11px}.composer{padding:5px;gap:4px}.composer textarea{font-size:11px;min-height:42px}.composer button{padding:0 9px;font-size:10px}}</style></head><body><div class="wrap"><header class="top"><h1>BANDtroductions <span>Messages</span></h1><a class="back" href="index.html">← Dashboard</a></header><main class="layout"><section class="panel"><h2>Inbox</h2><div id="conversation-list" class="status">Sign in to view messages.</div></section><section class="panel"><div class="thread"><div id="thread-head" class="thread-head">Select a conversation</div><div id="messages" class="messages"><div class="empty">Your BANDtroductions conversations will appear here.</div></div><form id="composer" class="composer" hidden><textarea id="message-input" maxlength="2000" placeholder="Write a message…"></textarea><button type="submit">SEND</button></form></div></section></main></div><script type="module" src="messages.js"></script></body></html>
