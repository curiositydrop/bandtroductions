<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Media | BANDtroductions</title>
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="stylesheet" href="auth.css?v=13">
  <style>
    .media-shell{width:min(calc(100vw - 16px),900px);margin:0 auto;padding:18px 0 36px}.media-head,.media-upload{padding:16px;border:1px solid #333;border-radius:15px;background:linear-gradient(145deg,#191919,#111);margin-bottom:12px}.media-head-row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.media-card{border:1px solid #333;border-radius:14px;background:#111;overflow:hidden}.media-preview{aspect-ratio:1/1;background:#080808;display:grid;place-items:center}.media-preview img,.media-preview video{width:100%;height:100%;object-fit:cover}.media-card-copy{padding:12px}.media-card-copy p{margin:5px 0;color:#aaa;font-size:.82rem}.media-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.media-actions button{width:auto!important}.media-empty{padding:22px;border:1px dashed #444;border-radius:14px;text-align:center;color:#aaa}.upload-progress{height:8px;background:#222;border-radius:999px;overflow:hidden;margin-top:10px}.upload-progress span{display:block;height:100%;width:0;background:#0ccfbd}.media-filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.media-filters button{width:auto!important}.media-filters button.is-active{outline:2px solid #0ccfbd}
  </style>
</head>
<body class="hamburger-active auth-page">
  <div id="global-header"></div>
  <main class="media-shell">
    <section class="media-head">
      <div class="media-head-row"><div><p class="profile-meta">PROFILE MEDIA LIBRARY</p><h1 id="media-title">My Media</h1><p class="auth-subtitle">Upload once, then reuse the same image or video on your profile and in community posts.</p></div><a id="back-profile" class="auth-button auth-button-secondary" href="profile.html">Back to Profile</a></div>
    </section>
    <section id="media-upload-card" class="media-upload" hidden>
      <h2>Upload Image or Video</h2>
      <label>Choose file<input id="media-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"></label>
      <label>Caption<input id="media-caption" type="text" maxlength="300" placeholder="Optional caption"></label>
      <button id="upload-media" class="auth-button" type="button">Upload to My Media</button>
      <div class="upload-progress" hidden><span id="upload-progress-bar"></span></div>
      <p id="upload-status" class="auth-message" role="status"></p>
    </section>
    <div class="media-filters"><button class="auth-button is-active" data-filter="all">All</button><button class="auth-button auth-button-secondary" data-filter="image">Images</button><button class="auth-button auth-button-secondary" data-filter="video">Videos</button></div>
    <section id="media-grid" class="media-grid"></section>
    <p id="media-status" class="auth-message">Loading media…</p>
  </main>
  <div id="global-footer"></div>
  <script src="global.js?v=10"></script>
  <script type="module" src="media-library.js?v=2"></script>
</body>
</html>
