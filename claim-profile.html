<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Profile | BANDtroductions</title>
  <link rel="stylesheet" href="style.css?v=8">
  <style>
    .claim-page{max-width:760px;margin:40px auto;padding:0 16px}.claim-card{background:#111;border:1px solid rgba(0,200,180,.35);border-radius:16px;padding:24px}.claim-summary{display:flex;gap:16px;align-items:center;margin:20px 0;padding:16px;background:#181818;border-radius:12px}.claim-image{width:88px;height:88px;border-radius:12px;object-fit:cover}.claim-card h1,.claim-card h2{margin-top:0}.claim-note{color:#ccc;line-height:1.6}.claim-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.claim-button{display:inline-block;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;text-decoration:none}.claim-button.primary{background:#00c8b4;color:#04110f}.claim-button.secondary{background:#2b2b2b;color:#fff}.claim-button:disabled{opacity:.5;cursor:not-allowed}.claim-status{margin-top:18px;line-height:1.55}.approval-meta{text-transform:capitalize;color:#bbb;margin:4px 0 0}
  </style>
</head>
<body>
  <div id="global-header"></div>
  <main class="claim-page">
    <section class="claim-card">
      <h1>Claim Your Existing Profile</h1>
      <p class="claim-note">Create or log in to your BANDtroductions account using the same email address already associated with this profile. No separate verification code is required.</p>
      <div id="claim-summary" class="claim-summary"></div>
      <div id="claim-status" class="claim-status">Checking this profile…</div>
      <div id="claim-controls" class="claim-actions" hidden>
        <button id="claim-button" class="claim-button primary" type="button">Finalize Claim</button>
      </div>
    </section>
  </main>
  <div id="global-footer"></div>
  <script src="global.js"></script>
  <script type="module" src="claim-profile.js?v=3"></script>
</body>
</html>
