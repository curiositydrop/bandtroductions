<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Upcoming Shows | BANDtroductions</title>
<meta name="description" content="Upcoming live shows from bands, musicians and venues in the BANDtroductions community. Go to shows. Keep music alive.">
<link rel="canonical" href="https://bandtroductions.com/shows.html">
<meta property="og:title" content="Upcoming Shows | BANDtroductions">
<meta property="og:description" content="Live shows from the underground scene. Support the scene. Go to shows.">
<meta property="og:image" content="https://bandtroductions.com/bt-share-1200x630.jpg">
<script src="bt-analytics.js?v=4"></script>
<style>
:root{--bg:#090a0a;--panel:#111313;--line:#343838;--teal:#25c7c1;--hot:#ff5a3c;--text:#eee;--muted:#9ca3a3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#161818 0,#090a0a 42%,#050606 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#090a0a;border-bottom:1px solid rgba(37,199,193,.42)}
.top .brand{font-weight:900;letter-spacing:.5px;text-decoration:none;font-size:15px}.top .brand span{color:var(--teal)}
.top nav{display:flex;gap:6px}.top nav a{font-size:11px;font-weight:900;text-decoration:none;border:1px solid var(--line);padding:7px 9px;letter-spacing:.5px}
.top nav a.primary{background:var(--teal);color:#041010;border-color:var(--teal)}
main{max-width:860px;margin:0 auto;padding:16px 12px 60px}
.hero{border:1px solid var(--line);background:linear-gradient(135deg,#140c0b,#0d1212);padding:22px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"LIVE";position:absolute;right:-8px;bottom:-22px;font-size:110px;font-weight:900;color:rgba(255,90,60,.07);letter-spacing:-4px}
.hero h1{margin:0;font-size:clamp(26px,6vw,44px);text-transform:uppercase;letter-spacing:-1px}.hero h1 span{color:var(--hot)}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14px;max-width:520px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.tools input{flex:1 1 220px;background:#070909;color:var(--text);border:1px solid var(--line);padding:11px;font:inherit;font-size:14px}
.chip{border:1px solid var(--line);background:#0d0f0f;color:var(--text);padding:9px 11px;font:inherit;font-size:11px;font-weight:900;cursor:pointer;letter-spacing:.5px}.chip.on{border-color:var(--teal);color:var(--teal)}
.month{margin:20px 0 8px;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--teal);text-transform:uppercase;border-bottom:1px dashed var(--line);padding-bottom:5px}
.card{display:grid;grid-template-columns:78px 1fr;gap:0;border:1px solid var(--line);background:var(--panel);margin-bottom:10px;position:relative}
.card.has-img{grid-template-columns:78px 1fr 120px}
.ticket{background:repeating-linear-gradient(0deg,#1a0f0d 0 6px,#1d1110 6px 12px);border-right:2px dashed #5a2b22;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center}
.ticket .dow{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:1px}
.ticket .mon{font-size:12px;font-weight:900;color:var(--hot);letter-spacing:1px}
.ticket .day{font-size:32px;font-weight:900;line-height:1}
.ticket .tag{margin-top:6px;font-size:9px;font-weight:900;background:var(--hot);color:#100;padding:2px 5px;letter-spacing:.5px}
.body{padding:12px;min-width:0}
.band{font-size:18px;font-weight:900;margin:0 0 4px;word-break:break-word}
.title{color:var(--muted);font-size:13px;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}.meta b{color:var(--teal)}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.pills span{font-size:10px;font-weight:900;border:1px solid var(--line);padding:3px 6px;color:#ccc}
details{margin-top:8px;font-size:13px;color:#cfd5d5}details summary{cursor:pointer;color:var(--teal);font-weight:900;font-size:11px;letter-spacing:.5px}
.details-text{white-space:pre-line;margin-top:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-block;text-decoration:none;font-size:11px;font-weight:900;border:1px solid var(--line);padding:8px 10px;letter-spacing:.5px;background:#0d0f0f;cursor:pointer;color:var(--text);font-family:inherit}
.btn.primary{background:var(--teal);color:#041010;border-color:var(--teal)}
.img{background:#000 center/cover no-repeat;border-left:1px solid var(--line)}
.empty,.status{border:1px dashed var(--line);padding:26px 14px;text-align:center;color:var(--muted)}
.empty a{color:var(--teal);font-weight:900}
.foot{margin-top:28px;text-align:center;font-weight:900;font-size:12px;letter-spacing:1px;color:var(--muted)}.foot strong{color:var(--teal)}
@media(max-width:600px){
 .top nav a.hide-sm{display:none}
 .card,.card.has-img{grid-template-columns:66px 1fr}
 .img{grid-column:1/-1;height:150px;border-left:0;border-top:1px solid var(--line);order:3}
 .ticket .day{font-size:26px}.band{font-size:16px}
}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">BAND<span>troductions</span></a><nav><a class="hide-sm" href="index.html">← SOCIAL</a><a class="hide-sm" href="radio.html">RADIO</a><a class="primary" href="show-event.html">+ POST A SHOW</a></nav></header>
<main>
<section class="hero"><h1>Upcoming <span>Shows</span></h1><p>Live music from bands, musicians and venues in the BANDtroductions community. Find a show. Go. Keep music alive.</p></section>
<div class="tools"><input id="q" type="search" placeholder="Search band, venue or city…" aria-label="Search shows"><button class="chip on" data-range="all">ALL</button><button class="chip" data-range="week">THIS WEEK</button><button class="chip" data-range="month">30 DAYS</button></div>
<section id="list"><div class="status">Loading shows…</div></section>
<p class="foot">SUPPORT THE SCENE. BUY MERCH. GO TO SHOWS. <strong>KEEP MUSIC ALIVE.</strong></p>
</main>
<script type="module" src="shows-page.js?v=1"></script>
</body>
</html>
