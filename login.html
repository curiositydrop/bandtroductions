<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | BANDtroductions</title>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="auth.css?v=1">
</head>
<body class="hamburger-active auth-page">
  <div id="global-header"></div>
  <main class="auth-shell">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Log in to manage your BANDtroductions account and profile.</p>
    <form id="login-form" class="auth-form">
      <label>Email<input id="email" type="email" required autocomplete="email"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <button id="login-button" class="auth-button" type="submit">Log In</button>
      <p id="login-message" class="auth-message" role="status"></p>
    </form>
    <p class="auth-links">Need an account? <a id="signup-link" href="signup.html">Create one</a></p>
    <p class="auth-links"><a href="index.html">Continue browsing as a guest</a></p>
  </main>
  <div id="global-footer"></div>
  <script src="global.js?v=2"></script>
  <script type="module">
    import { auth } from './firebase-dev.js';
    import { signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';

    const params = new URLSearchParams(location.search);
    const requestedReturn = params.get('returnTo') || '';
    const safeReturn = requestedReturn && !requestedReturn.startsWith('//') && !requestedReturn.includes('://')
      ? requestedReturn
      : 'community.html';

    const signupLink = document.getElementById('signup-link');
    if (requestedReturn) signupLink.href = `signup.html?returnTo=${encodeURIComponent(safeReturn)}`;

    const form = document.getElementById('login-form');
    const button = document.getElementById('login-button');
    const message = document.getElementById('login-message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = 'Logging in...';
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        window.location.href = safeReturn;
      } catch (error) {
        console.error(error);
        message.textContent = 'Email or password was not recognized.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
