<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b100f">
<title>Website + Merch Activated | BANDtroductions</title>
<style>
:root{color-scheme:dark;--bg:#0b100f;--panel:#121916;--ink:#eef4ee;--muted:#aeb9b0;--accent:#25c7c1;--line:#ffffff24}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#18251d,var(--bg) 52%);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(720px,calc(100% - 28px));padding:26px 0 48px}.brand{display:block;margin:0 0 24px;text-align:center;color:var(--ink);font-weight:950;letter-spacing:.08em;text-decoration:none}.card{padding:clamp(24px,5vw,42px);border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#151e19,#0d1210);box-shadow:0 22px 70px #0006;text-align:center}.check{width:72px;height:72px;margin:0 auto 18px;display:grid;place-items:center;border:2px solid var(--accent);border-radius:50%;color:var(--accent);font-size:38px;font-weight:950}.eyebrow{margin:0 0 8px;color:var(--accent);font-size:12px;font-weight:950;letter-spacing:.17em;text-transform:uppercase}h1{margin:0;font-size:clamp(36px,9vw,62px);line-height:1.02;letter-spacing:-.045em}p{color:var(--muted)}.lead{font-size:18px;max-width:560px;margin:18px auto}.status{min-height:24px;margin:14px 0;color:#dbe5dc}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 18px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:#06110f;font-weight:950;text-decoration:none}.button.secondary{background:transparent;color:var(--ink);border-color:#66746b}.button.full{grid-column:1/-1}@media(max-width:560px){.actions{grid-template-columns:1fr}.button.full{grid-column:auto}}
</style>
</head>
<body>
<main class="shell">
<a class="brand" href="index.html">BANDtroductions</a>
<section class="card">
<div class="check">✓</div>
<p class="eyebrow">Upgrade complete</p>
<h1>Website + Merch activated!</h1>
<p class="lead">Your artist website and merch storefront are being activated automatically. You can start customizing them now.</p>
<p id="status" class="status">Loading your artist tools…</p>
<div class="actions">
<a id="edit-site" class="button" href="profile.html">Edit My Website</a>
<a id="manage-merch" class="button" href="merch.html">Manage My Merch</a>
<a id="view-profile" class="button secondary full" href="profile.html">View My Profile</a>
</div>
</section>
</main>
<script type="module">
import { auth } from './firebase-dev.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
const status=document.getElementById('status');
const edit=document.getElementById('edit-site');
const profile=document.getElementById('view-profile');
onAuthStateChanged(auth,user=>{
 if(!user){status.textContent='Your upgrade is complete. Sign in to manage your artist tools.';edit.href='login.html';profile.href='login.html';return;}
 const id=encodeURIComponent(user.uid);
 edit.href=`website.html?id=${id}&edit=1`;
 profile.href=`profile.html?id=${id}`;
 status.textContent='You’re all set. Choose where you want to go next.';
});
</script>
</body>
</html>
