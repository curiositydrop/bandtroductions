<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | BANDtroductions</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://bandtroductions.com/signup.html">
<meta http-equiv="refresh" content="0; url=signup.html">
<link rel="stylesheet" href="style.css?v=4">

<style>
.signup-switcher {
  text-align: center;
  margin: 0 auto 30px;
}

.signup-button-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.signup-toggle {
  cursor: pointer;
}

.signup-form-panel {
  display: none;
}

.signup-form-panel.active {
  display: block;
}

@media (max-width: 768px) {
  .signup-button-row {
    gap: 10px;
  }
}
</style>

<!-- Global Header/Footer -->
<script src="global.js" defer></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-60112G8RH3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-60112G8RH3');
</script>
</head>

<body>

<div id="global-header"></div>

<section class="form-page">

  <h2>Sign Up for BANDtroductions</h2>

  <p>This page has moved. Taking you to the BANDtroductions sign-up page&hellip;</p>

  <p><a class="button" href="signup.html">Go to sign up</a></p>

</section>

<div id="global-footer"></div>

<script>
function showSignupForm(formId) {
  const panels = document.querySelectorAll('.signup-form-panel');
  panels.forEach(panel => panel.classList.remove('active'));

  const selected = document.getElementById(formId);
  if (selected) {
    selected.classList.add('active');
    selected.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function validateBandForm() {
  const imageUpload = document.getElementById("band-image").files.length;
  const imageLink = document.getElementById("band-image-link").value.trim();

  if (imageUpload === 0 && imageLink === "") {
    alert("Please upload a band photo OR provide an image link.");
    return false;
  }

  return true;
}

function validateMusicianForm() {
  const imageUpload = document.getElementById("photo").files.length;
  const imageLink = document.getElementById("photo-link").value.trim();

  if (imageUpload === 0 && imageLink === "") {
    alert("Please upload a profile photo OR provide an image link.");
    return false;
  }

  return true;
}

function validateVenueForm() {
  const imageUpload = document.getElementById("venue-photo").files.length;
  const imageLink = document.getElementById("venue-photo-link").value.trim();

  if (imageUpload === 0 && imageLink === "") {
    alert("Please upload a venue photo/logo OR provide an image link.");
    return false;
  }

  return true;
}
</script>

</body>
</html>
