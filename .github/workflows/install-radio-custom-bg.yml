name: Install custom radio background
on:
  push:
    branches: [main]
    paths:
      - 'bt-radio-panel-custom.b64'
      - '.github/workflows/install-radio-custom-bg.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode radio background
        shell: bash
        run: |
          set -euo pipefail
          base64 -d bt-radio-panel-custom.b64 > bt-radio-panel-custom.jpg
          test -s bt-radio-panel-custom.jpg
          file bt-radio-panel-custom.jpg | grep -qi 'JPEG image data'
      - name: Point live radio panel at custom image and bump cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dashboard-radio-firestore.js')
          s=p.read_text()
          old='url("bt-radio-speaker-frame.webp?v=20260907-radio3") 78% center/cover no-repeat!important'
          new='url("bt-radio-panel-custom.jpg?v=20260907-radio5") center center/cover no-repeat!important'
          if old not in s:
              raise SystemExit('Expected radio background rule not found')
          p.write_text(s.replace(old,new,1))
          p=Path('index.html')
          s=p.read_text()
          old='dashboard-radio-firestore.js?v=7'
          new='dashboard-radio-firestore.js?v=8'
          if old not in s:
              raise SystemExit('Expected radio script version not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit installed image
        shell: bash
        run: |
          set -euo pipefail
          rm -f bt-radio-panel-custom.b64
          git config user.name 'Curiositydrop'
          git config user.email 'info@curiositydrop.com'
          git add bt-radio-panel-custom.jpg dashboard-radio-firestore.js index.html bt-radio-panel-custom.b64
          git commit -m 'Use custom speaker artwork for homepage radio background'
          git push
