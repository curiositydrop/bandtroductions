name: Radio Phase 0 safety checks
on:
  pull_request:
    paths:
      - 'radio-playlist-validation.mjs'
      - 'radio-playlist-save-fix.js'
      - 'radio-schedule-engine.js'
      - 'radio-break-planner.mjs'
      - 'radio-two-ad-editor.js'
      - 'admin.html'
      - 'tests/radio-break-planner.test.mjs'
      - 'tests/radio-playlist-validation.test.mjs'
      - 'tests/between-show-ad-engine.test.mjs'
      - '.github/workflows/radio-phase0-checks.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check radio-playlist-save-fix.js && node --check radio-schedule-engine.js && node --check radio-playlist-validation.mjs && node --check radio-break-planner.mjs && node --check radio-two-ad-editor.js
      - run: node --test tests/radio-playlist-validation.test.mjs tests/radio-break-planner.test.mjs
      - run: node tests/between-show-ad-engine.test.mjs
      - name: Verify Control Room integration
        run: grep -q 'radio-two-ad-editor.js' admin.html && grep -q 'Preview is read-only' radio-two-ad-editor.js
